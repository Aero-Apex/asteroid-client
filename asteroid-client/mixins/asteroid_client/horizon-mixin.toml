[mod]
id = "asteroid_client"
version = "2.2.0"
priority = 90

# Hooks the native hook points and a few game functions (reach, mob_hit,
# chat input, movement packets, mining, connecting), so it pins the commit it
# was built and tested on.
[compatibility]
